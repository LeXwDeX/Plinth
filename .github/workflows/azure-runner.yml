# Azure 按需 runner 开机（#78）。ci.yml 的 go test race 在可信事件上路由到 plinth-azure 标签：
# 本仓库 main 的 push，以及 head 在本仓库的 pull_request。这里在同样的事件上立即开机；
# 另每 10 分钟（及手动触发时）检查一次：有 race 作业在排队等 plinth-azure 就开机，
# 覆盖重跑作业（重跑不会再触发 push/pull_request）与开机失败的情况。
# VM 自己在空闲 10 分钟后解除分配，另有平台侧每日定时关机兜底。
# 本工作流不跑任何门禁，只持有开机所需的 OIDC 身份；该身份的角色只能读取、开机、
# 解除分配这一台 VM。fork 的 PR 拿不到 OIDC token，判断条件也把它排除在外；
# 定时与手动触发只执行默认分支上的本文件，也不读取任何触发方的代码。
# 安装脚本在 scripts/azure-runner/vm-setup.sh，规则见 dev_test.md §2「Azure 按需 runner」。

name: azure runner

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start:
    name: start azure runner
    if: >-
      ${{
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      # 定时与手动触发只在确有作业排队等 plinth-azure 时才开机。
      - id: queued
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          count=0
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?per_page=50" \
              --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress") | .id'); do
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" \
              --jq '[.jobs[] | select(.status == "queued" and (.labels | index("plinth-azure")))] | length')
            count=$((count + jobs))
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: ${{ steps.queued.outcome == 'skipped' || steps.queued.outputs.count != '0' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # 已在运行时 start 直接返回；VM 开机后 runner 服务自动上线，排队中的 race 作业随即被领取。
      - if: ${{ steps.queued.outcome == 'skipped' || steps.queued.outputs.count != '0' }}
        run: az vm start --resource-group "$RESOURCE_GROUP" --name "$VM" --output none
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RUNNER_RESOURCE_GROUP }}
          VM: ${{ vars.AZURE_RUNNER_VM }}

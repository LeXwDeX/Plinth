# Azure 按需 runner 开机（#78）。ci.yml 的 go test race 在可信事件上路由到 plinth-azure 标签：
# 本仓库 main 的 push，以及 head 在本仓库的 pull_request。这里在同样的事件上开机；
# VM 自己在空闲 10 分钟或开机满 3 小时后解除分配，另有 Azure 侧每日定时关机兜底。
# 本工作流不跑任何门禁，只持有开机所需的 OIDC 身份；该身份的角色只能读取、开机、
# 解除分配这一台 VM。fork 的 PR 拿不到 OIDC token，判断条件也把它排除在外。
# 规则见 dev_test.md §2「Azure 按需 runner」。

name: azure runner

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  start:
    name: start azure runner
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # 已在运行时 start 直接返回；VM 开机后 runner 服务自动上线，排队中的 race 作业随即被领取。
      - run: az vm start --resource-group "$RESOURCE_GROUP" --name "$VM" --output none
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RUNNER_RESOURCE_GROUP }}
          VM: ${{ vars.AZURE_RUNNER_VM }}

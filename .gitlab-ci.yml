# 门禁真源：dev_test.md §2「自动化门禁项」。CI 执行其中标为 CI 的各项，命令逐字
# 照抄、每项只在一个作业里出现；src/__tests__/ci-gate-parity.test.ts 校验。
# 镜像构建不在 CI（发布仍走 dev-test 既有流程）。
# 单一 stage：三个作业同时排队、互不等待；每个作业各占一个 runner 槽位，
# 所以前端各项合并为一个作业，只装一次依赖。
# 作业使用 linux 标签；可用 Runner 以 GitLab 当前项目设置为准。

# 自动 CI 已恢复（#257）：每次推送和每个 MR 都运行完整门禁；仍支持 web/API/tag
# 手动触发。合并前本机门禁仍是开发闭环的一部分，但不再替代这里。
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger" || $CI_COMMIT_TAG'
    - when: never

stages:
  - gates

default:
  tags: [linux]

variables:
  GIT_DEPTH: "20"

.node: &node
  image:
    name: node:22-bookworm-slim
    pull_policy: if-not-present
  variables:
    PNPM_HOME: /cache/pnpm
    npm_config_store_dir: /cache/pnpm-store
    COREPACK_HOME: /cache/corepack
    # 公共 registry 缺省（#257）。项目/组 CI/CD 变量可覆盖这里的作业变量，所以 npm 与
    # pnpm 的安装命令都显式传 --registry；pnpm 版本与 package.json 的 packageManager
    # 一致；runner 缓存只加速，缓存未命中时仍访问公共源。
    npm_config_registry: https://registry.npmjs.org/
  cache:
    key: pnpm-$CI_COMMIT_REF_SLUG
    paths:
      - /cache/pnpm-store
  before_script:
    # 公共 tarball URL 只固定 pnpm 包本身，其依赖仍按 registry 解析。项目/组变量可覆盖
    # 作业变量，npm_config_registry、PNPM_CONFIG_REGISTRY 也优先于 ~/.npmrc，所以 npm、
    # pnpm 两条安装命令都显式传 --registry；bootstrap 后 ~/.npmrc 写入同一 registry。
    - npm install --global --registry=https://registry.npmjs.org/ "https://registry.npmjs.org/pnpm/-/pnpm-12.5.1.tgz"
    - printf 'registry=%s\n' "https://registry.npmjs.org/" > "$HOME/.npmrc"
    - pnpm install --frozen-lockfile --prefer-offline --registry=https://registry.npmjs.org/
    # administration acceptance 测试的 bash 块使用 jq；node 镜像没有 jq
    # 且 apt 出网不可靠，改用仓库内 vendor 的静态二进制（来源与校验值
    # 见 scripts/vendor/jq-linux-amd64.sha256）。
    - echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  scripts/vendor/jq-linux-amd64" | sha256sum --check --status
    - install -m 755 scripts/vendor/jq-linux-amd64 /usr/local/bin/jq
    - jq --version

.golang: &golang
  image:
    name: golang:1.27
    pull_policy: if-not-present
  variables:
    GOPATH: /cache/go
  cache:
    key: go-modules
    paths:
      - /cache/go/pkg/mod

frontend:
  <<: *node
  stage: gates
  script:
    - pnpm exec tsc --noEmit
    - pnpm test
    - pnpm build
    # 内网零互联网：构建产物不得含外链（脚本已随 pnpm build 执行，此处单独再验一次）
    - node scripts/check-build-external-links.mjs

go check:
  <<: *golang
  stage: gates
  script:
    - go vet ./...
    - CGO_ENABLED=0 go build -trimpath ./cmd/art-ai
    # 公开快照扫描（#261）：只需 git 与 python3（golang 镜像基于 buildpack-deps:scm，自带二者）。
    - bash scripts/check-public-tree.sh

# 非 race 的 go test 不在 CI：race 跑同一批测试且更严格（dev_test.md §2）。
go test race:
  <<: *golang
  stage: gates
  # internal/transport/httpapi takes ~596s under -race on this runner, right at go test's
  # default 10m per-package timeout, so pipelines fail at random. Raise it the same way
  # scripts/verify-local.py does; the gate command itself stays as dev_test.md §2 lists it.
  # A job-level variables map replaces the anchor's, so GOPATH is repeated here.
  variables:
    GOPATH: /cache/go
    GOFLAGS: -timeout=30m
  script:
    - CGO_ENABLED=1 go test -race -count=1 ./...
  timeout: 45m
